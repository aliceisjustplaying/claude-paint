[workspace]
resolver = "3"
members = ["crates/paint", "crates/easel"]

[profile.release]
opt-level = 3
debug = false
# Deterministic codegen: paintings must replay byte for byte, and an
# incremental build (or several codegen units) can partition and optimize the
# same code differently from one rebuild to the next, moving a few pixels by
# 1/255. Slower rebuilds are the price.
incremental = false
codegen-units = 1

# Tests run optimized (the physics tests took ~10 min unoptimized), with
# debug assertions and overflow checks kept on. Not incremental, so a test
# build's floats don't wobble between rebuilds either (the golden scene
# and the debug replay hashes are recorded with this profile).
[profile.test]
opt-level = 2
incremental = false
debug-assertions = true
overflow-checks = true

# Development iteration only (`cargo build --profile iter -p easel`, into
# target/iter): release optimizations, but incremental with 16 codegen units,
# so a one-line change rebuilds in seconds. Its floats may differ from the
# release build's by a few pixels (see [profile.release]): real paintings,
# goldens and studio exports keep the release profile (notes/workflow.md).
[profile.iter]
inherits = "release"
incremental = true
codegen-units = 16
