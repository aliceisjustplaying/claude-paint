skip_clone: true

labels:
  backend: local
  platform: linux/amd64

when:
  - event: pull_request
  - event: pull_request_metadata
    evaluate: 'CI_PIPELINE_EVENT_REASON == "label_updated" && CI_COMMIT_PULL_REQUEST_LABELS contains "review:claude"'

steps:
  - name: review
    image: bash
    environment:
      GH_TOKEN:
        from_secret: pr_review_github_token
      REVIEW_MODEL_KEY:
        from_secret: pr_review_model_key
    commands:
      - pr-review
