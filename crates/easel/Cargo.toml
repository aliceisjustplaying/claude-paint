[package]
name = "easel"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["replay", "finish"]
# The developer/runner build: EASEL_ROOT, named sessions (-s, EASEL_SESSION),
# `easel run` (with --dump-surface) and `hash-probe`. Without it (the
# painter build, `--no-default-features`) the studio is the directory above
# the one holding the executable (<studio>/bin/easel) and it holds one
# painting, "painting".
replay = ["paint/hand-hook", "all-boxes", "dep:rayon"]
# varnish{}, cracks{} and relief(): whole-picture finishing, applied after
# the painter's session by scripts/finish_painting. Not in the painter build,
# so finishing can't become the painter's way of ending.
finish = []
# The boxes besides the default tube box (paint's `box-*` features): the
# replay build has them all, so it replays any log; a painter's build is
# built with its studio's only (scripts/export_r16_studio), so nothing in it
# names another studio's box. Its `paint/all-boxes` puts the default tube box
# in too (paint's build.rs); two box-* features without it are a compile error.
all-boxes = ["box-sargent", "box-inness", "box-alma-tadema", "box-tonn", "box-hopper", "paint/all-boxes"]
box-sargent = ["paint/box-sargent"]
box-inness = ["paint/box-inness"]
box-alma-tadema = ["paint/box-alma-tadema"]
box-tonn = ["paint/box-tonn"]
box-hopper = ["paint/box-hopper"]

[[bin]]
name = "easel"
path = "src/main.rs"

[dependencies]
paint = { path = "../paint", default-features = false }
mlua = { version = "0.12", features = ["lua55", "vendored"] }
# the old logs' trees, sky and rocks (src/legacy; the replay build)
rayon = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
