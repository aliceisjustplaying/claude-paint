[package]
name = "easel"
version = "0.1.0"
edition = "2024"
publish = false

[features]
state-store = ["dep:sha2", "dep:serde", "dep:serde_json"]
render-snapshot = ["state-store", "paint/render-snapshot"]

[[bin]]
name = "easel"
path = "src/main.rs"

[dependencies]
paint = { path = "../paint", features = ["hand-hook"] }
# Upgrading mlua/lua-src/Lua: session.rs `TableHead` reads Lua 5.5.1's
# private table layout; recheck it first (notes/easel.md "Lua internals
# read directly").
mlua = { version = "0.12", features = ["lua55", "vendored"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zstd = "0.13"
sha2 = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
