[package]
name = "paint"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# `tally::hand_hook`: a callback after each slice of hand time goes on the
# clock (easel uses it for hand-time frames).
hand-hook = []
render-snapshot = []
replay-effects = ["dep:serde"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.10"
tiny-skia = "0.12"
