[package]
name = "watercolor-pilot"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["lab-core", "lab-wasm"]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"
mlua = { version = "0.12", features = ["lua55", "vendored"] }
image = { version = "0.25", default-features = false, features = ["png"] }
watercolor-lab-core = { path = "lab-core" }
pollster = "0.4"

[profile.test]
opt-level = 2

[[bin]]
name = "watercolor-probes"
path = "src/bin/probes.rs"

[[bin]]
name = "watercolor-studio"
path = "src/bin/studio.rs"
