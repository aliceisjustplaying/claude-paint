[package]
name = "watercolor-pilot"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"

[profile.test]
opt-level = 2

[[bin]]
name = "watercolor-probes"
path = "src/bin/probes.rs"
