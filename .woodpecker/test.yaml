labels:
  backend: local
  platform: linux/amd64

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 1

steps:
  test:
    image: bash
    commands:
      - nix print-dev-env --no-write-lock-file .#default > .ci-env
      - source .ci-env
      - scripts/test
